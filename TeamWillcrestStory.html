    <style>
        .reader-body {

        /* Reading Themes */

        body.theme-dark { background-color: #121212; color: #e0e0e0; }
        body.theme-sepia { background-color: #f4ecd8; color: #4a3b32; }

        .theme-dark .card-control { background-color: #1e1e1e; border-color: #333; color: #fff; }
        .theme-sepia .card-control { background-color: #e8dfc8; border-color: #d8cca8; color: #4a3b32; }

<body id="readerBody" class="theme-light d-flex flex-column min-vh-100">

                <button class="btn btn-outline-secondary" onclick="setTheme('light')">Light</button>

        <p class="mb-0 text-muted">&copy; 2026 Ayankoya Productions. All rights reserved.</p>

    <script>
        let currentFontSize = 1.15;

        function changeFontSize(delta) {
            currentFontSize += delta * 0.1;
            if (currentFontSize < 0.85) currentFontSize = 0.85;
            if (currentFontSize > 1.6) currentFontSize = 1.6;
            document.getElementById('textContent').style.fontSize = currentFontSize + 'rem';
        }

        function setTheme(themeName) {
            const body = document.getElementById('readerBody');
            body.className = 'd-flex flex-column min-vh-100 theme-' + themeName;
        }
    </script>
